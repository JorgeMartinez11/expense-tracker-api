services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expenses-local}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/expenses
      DB_USERNAME: expenses
      DB_PASSWORD: ${DB_PASSWORD:-expenses-local}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
volumes:
  postgres-data:
