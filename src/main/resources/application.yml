spring:
  application:
    name: expense-tracker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/expenses}
    username: ${DB_USERNAME:expenses}
    password: ${DB_PASSWORD:expenses-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
